name: 🐛 Bug Report
description: Report an issue with episode downloading, player HUD, or redirects.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.
  - type: input
    id: episode-url
    attributes:
      label: Anime Episode URL
      description: The page where you encountered the issue (e.g. https://aniwatch.co.at/watch/...)
      placeholder: https://aniwatch.co.at/watch/...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome (Desktop)
        - Brave Browser (Desktop)
        - Microsoft Edge (Desktop)
        - Orion Browser (iOS / iPadOS)
        - Orion Browser (macOS)
        - Opera / Opera GX
        - Other (please specify in details)
    validations:
      required: true
  - type: dropdown
    id: resolution
    attributes:
      label: Selected Quality
      options:
        - 1080p Full HD
        - 720p HD
        - 480p SD
        - N/A (Player HUD or UI issue)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened vs what you expected.
      placeholder: When I clicked Download 1080p, the progress bar started but stopped at...
    validations:
      required: true
  - type: textarea
    id: console-logs
    attributes:
      label: Browser Console Logs (if applicable)
      description: Press F12 -> Console, filter by `[FocusGuard]`, and paste relevant logs here.
      placeholder: "[FocusGuard Background] Video download error: ..."
      render: shell

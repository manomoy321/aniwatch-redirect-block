<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
          <div class="brand-glow"></div>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">FocusGuard</h1>
          <div class="domain-badge" id="current-domain-display" title="Current Active Domain">
            <span class="pulse-dot"></span>
            <span id="domain-text">Detecting site...</span>
          </div>
        </div>
      </div>
      <div class="status-indicator-pill" id="status-pill">
        <span class="status-text" id="status-text">ACTIVE</span>
      </div>
    </header>

    <!-- Master Switch Hero Card -->
    <section class="hero-card" id="hero-card">
      <div class="hero-info">
        <h2 class="hero-title">Protection Shield</h2>
        <p class="hero-subtitle" id="hero-status-desc">Neutralizing click redirects & pop-unders</p>
      </div>
      <label class="switch-toggle" for="master-toggle">
        <input type="checkbox" id="master-toggle" checked>
        <span class="slider round"></span>
      </label>
    </section>

    <!-- Metrics Grid -->
    <section class="metrics-grid">
      <div class="metric-card">
        <span class="metric-label">This Site</span>
        <div class="metric-value-wrap">
          <span class="metric-value" id="site-blocked-count">0</span>
          <span class="metric-unit">blocked</span>
        </div>
      </div>
      <div class="metric-card">
        <span class="metric-label">Lifetime</span>
        <div class="metric-value-wrap">
          <span class="metric-value" id="total-blocked-count">0</span>
          <span class="metric-unit">trapped</span>
        </div>
      </div>
    </section>

    <!-- Configuration Options -->
    <section class="settings-section">
      <h3 class="section-heading">Redirect Behavior</h3>
      
      <!-- Mode Segmented Switch -->
      <div class="mode-selector-card">
        <div class="mode-selector-header">
          <span class="mode-label">When a popup triggers:</span>
        </div>
        <div class="segmented-control" id="mode-segmented-control">
          <button type="button" class="segment-btn active" id="btn-mode-block" data-mode="block_and_close">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            Block & Close
          </button>
          <button type="button" class="segment-btn" id="btn-mode-focus" data-mode="keep_focus">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M14 9l3 3-3 3"/></svg>
            Lock Main Tab
          </button>
        </div>
      </div>

      <!-- Feature Toggles -->
      <div class="feature-item">
        <div class="feature-info">
          <span class="feature-name">Kill Clickjack Overlays</span>
          <span class="feature-desc">Destroys transparent click-stealing layers over players</span>
        </div>
        <label class="switch-toggle-sm" for="toggle-overlays">
          <input type="checkbox" id="toggle-overlays" checked>
          <span class="slider-sm round"></span>
        </label>
      </div>

      <!-- Whitelist Button -->
      <div class="action-card">
        <button type="button" class="btn-action" id="btn-toggle-whitelist">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
          <span id="whitelist-btn-text">Pause Protection on this Site</span>
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span class="footer-version">FocusGuard v1.0 • Manifest V3</span>
      <button type="button" class="btn-text" id="btn-reset-stats">Reset Counters</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
